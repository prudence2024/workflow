# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration — Diplomat Global
# Docs: https://docs.coderabbit.ai/reference/configuration

language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: false
  collapse_walkthrough: true

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!.output/**"
    - "!.tanstack/**"
    - "!src/routeTree.gen.ts"
    - "!.freebuff/**"

  path_instructions:
    - path: "src/lib/**/*.server.ts"
      instructions: |
        Treat server code as security-sensitive.
        Check authentication (Clerk), authorization (RBAC), privileged database
        access, input validation (Zod), rate limiting, race conditions,
        PII leakage, service-role exposure, and fail-open behavior.
        For each serverFn: verify requirePermission is called with the
        correct permission string before any mutation.

    - path: "src/**/*payment*"
      instructions: |
        Treat payment code as hostile-input financial code.
        Attack for: Paystack signature bypass, webhook forgery, replay attacks,
        duplicate finalization, inventory CAS races, coupon double-use,
        receipt duplication, provider failure handling, idempotency.
        Verify server-calculated amounts are authoritative (never client-supplied).

    - path: "src/**/*checkout*"
      instructions: |
        Attack checkout-controlled inputs.
        Verify: input validation, server authority for pricing/product identity,
        coupon normalization and application, XSS/tampering, payment
        initialization security, cart state consistency.

    - path: "src/routes/dashboard*.tsx"
      instructions: |
        Review Admin dashboard changes for: RBAC permission checks,
        privilege escalation, false-success mutations, stale data after
        cache invalidation, destructive action confirmations, accessibility
        (aria-invalid, focus management), mobile responsiveness (no
        overflow-x:hidden on page containers, tables in overflow-x-auto).

    - path: "src/**/*upload*"
      instructions: |
        Review upload security: RBAC before signing, Cloudinary signature
        server-generated (never client), MIME/content validation enforced
        server-side, file size limits, SVG/script prevention, rate limiting
        per-user not globally shared, Cloudinary URL storage safety.

    - path: "src/**/*coupon*"
      instructions: |
        Review coupon normalization (lowercase, trim), uniqueness enforcement,
        exhaustion handling, concurrency safety, payment failure behavior,
        duplicate creation prevention, default max_uses correctness.

    - path: "src/**/*inventory*"
      instructions: |
        Review inventory consistency: single source of truth for availability,
        negative inventory prevention, Sold Out state logic, CAS operations
        during payment finalization, concurrent decrement safety.

    - path: "src/**/*backup*"
      instructions: |
        Review backup/restore for: RBAC (Owner-level required), secret/token
        leakage in exports, PII exposure in logs, CSV formula injection
        prevention (= + - @ prefix), restore destructive confirmation,
        ZIP content sanitization.

    - path: "supabase/migrations/**"
      instructions: |
        Review migrations for: destructive SQL (DROP without backup), NULL
        semantics on existing rows, constraint conflicts, index lock behavior,
        GRANT/REVOKE scope, idempotency, backward compatibility with
        running application code, unsafe backfills.

    - path: "tests/**"
      instructions: |
        Check for missing test coverage: unauthorized access paths, malformed
        input boundary cases, duplicate request scenarios, external service
        failure mocks, race condition testability, regression coverage for
        previously-fixed bugs.

    - path: "src/routes/index.tsx"
      instructions: |
        Review public homepage: above-fold content prioritization, image
        priority flags for hero/first products, SEO meta tags, broken image
        fallback (OptimizedImage everywhere), mobile layout (no overflow).

    - path: "src/styles.css"
      instructions: |
        Flag any overflow-x:hidden added to html or body. This was a
        previously-identified defect that masked real layout bugs.
        Actual overflowing components must be fixed at the component level.

auto_review:
  enabled: true
  drafts: false
  auto_incremental_review: true
  base_branches:
    - "testing"

chat:
  auto_reply: true
