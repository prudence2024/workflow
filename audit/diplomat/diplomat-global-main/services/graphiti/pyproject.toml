[project]
name = "diplomat-graphiti"
version = "0.1.0"
description = "Graphiti knowledge graph service for Diplomat Global"
requires-python = ">=3.10"
dependencies = [
    "graphiti-core>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
